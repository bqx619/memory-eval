[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-memory-eval"
version = "0.1.0"
description = "Source-grounded Personal Agent memory diagnostics and adapters"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT; bundled source fixtures retain third-party MIT attribution"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pa-memory-eval = "pa_memory_eval.__main__:main"

[tool.setuptools.packages.find]
include = ["pa_memory_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
